# Any Model Plugin — Provider registry (shippable defaults, user-editable)
# See ARCHITECTURE.md §4 for design rationale and quirk pipeline details.

[providers.zai]
base_url = "https://api.z.ai/api/coding/paas/v4"
env_key  = "ZAI_API_KEY"
wire     = "chat"
quirks   = ["function-tools-only", "flat-assistant-content", "strict-tool-adjacency"]

[providers.ollama]
base_url = "https://ollama.com/v1"
env_key  = "OLLAMA_API_KEY"
wire     = "chat"
quirks   = []

[providers.opencode-go]
base_url = "https://opencode.ai/zen/go/v1"
env_key  = "OPENCODE_API_KEY"
wire     = "chat"
quirks   = ["function-tools-only", "flat-assistant-content", "strict-tool-adjacency",
            "empty-choices-chunks"]
