name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check all modules
        run: |
          set -e
          for f in $(git ls-files '*.mjs'); do
            node --check "$f"
          done
      - name: Unit and integration tests
        run: node --test
      - name: MCP protocol smoke test
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node plugins/anymodel/scripts/mcp-server.mjs \
            | node -e '
              let data = "";
              process.stdin.on("data", (d) => (data += d));
              process.stdin.on("end", () => {
                const lines = data.trim().split("\n").map((l) => JSON.parse(l));
                const init = lines.find((m) => m.id === 1);
                const tools = lines.find((m) => m.id === 2);
                if (!init?.result?.serverInfo) throw new Error("initialize failed");
                if ((tools?.result?.tools ?? []).length !== 8) throw new Error("expected 8 tools");
                const names = tools.result.tools.map(t => t.name).sort();
                const expected = ["adversarial_review","cancel","delegate","models","result","review","setup","status"];
                if (JSON.stringify(names) !== JSON.stringify(expected)) throw new Error("unexpected tool names: " + names.join(", "));
                console.log("MCP smoke OK:", names.length, "tools:", names.join(", "));
              });
            '
